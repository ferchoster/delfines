name: cevicheria_los_delfines_erp
description: ERP Android offline para Cevichería Los Delfines.
publish_to: 'none'
version: 0.10.0+10
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  pdf: ^3.11.3
  excel: ^4.0.6
  cross_file: ^0.3.4+2
  printing: ^5.14.2
  mobile_scanner: ^7.0.1
  shared_preferences: ^2.5.3
  crypto: ^3.0.6
  file_picker: ^10.2.0
  share_plus: ^11.0.0
  permission_handler: ^12.0.1
  flutter_blue_plus: ^1.35.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/legacy/los_delfines_base.db
