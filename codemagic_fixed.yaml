workflows:
  android-apk:
    name: Cevichería Los Delfines - APK Android
    max_build_duration: 60
    # Mac mini M2: compatible with the personal plan's included build minutes.
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Generar estructura nativa de Android
        script: |
          flutter create --platforms=android --org com.losdelfines --no-pub .
      - name: Descargar dependencias
        script: |
          flutter pub get
      - name: Compilar APK de producción
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha1
